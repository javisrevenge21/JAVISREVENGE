<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Member · JAVISREVENGE</title><link rel="stylesheet" href="/assets/community.css"></head><body>
<main class="page">
<a class="brand" href="/wall">← THE WALL</a>
<div id="card" style="margin-top:24px"><p class="empty">Loading…</p></div>
<section class="panel admin-box" id="admin" hidden>
<p class="label" style="color:#fca5a5">Owner only</p>
<p style="margin:0">Email: <strong id="aEmail"></strong></p>
<div class="row"><button class="btn small ghost" id="remove" type="button">Remove account</button><input id="reason" placeholder="Ban reason (optional)" maxlength="200" style="flex:1;min-width:160px;padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff"><button class="btn small danger" id="ban" type="button">Ban</button></div>
<p class="muted" style="margin:8px 0 0">Remove deletes their account, frees the username and deletes their Wall posts. Ban does the same and blocks the email from ever signing in again.</p>
<p class="status" id="aStatus"></p>
</section>
<section class="panel" style="padding:0;overflow:hidden"><p class="label" style="padding:16px 16px 0">Posts</p><div id="posts"></div></section>
</main>
<script src="/assets/community.js"></script>
<script>
(function () {
  var name = decodeURIComponent(location.pathname.split('/')[2] || '').toLowerCase();
  var postsEl = document.getElementById('posts'), author;
  var reactions = [], isAdmin = false;
  JR.wire(postsEl, function () { return author; }, reactions, function () { return isAdmin; });
  if (!name) { location.replace('/wall'); return; }
  fetch('/api/community?view=profile&u=' + encodeURIComponent(name)).then(function (r) {
    if (r.status === 401 || r.status === 403) { location.replace('/signin?returnTo=' + encodeURIComponent(location.pathname)); throw 0; }
    return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; });
  }).then(function (d) {
    var u = d.profile; author = u; isAdmin = d.admin; Array.prototype.push.apply(reactions, d.reactions);
    document.title = '@' + u.username + ' · JAVISREVENGE';
    document.getElementById('card').innerHTML = JR.card(u) + (d.me === u.username ? '<p style="text-align:center;margin-top:12px"><a class="btn ghost small" href="/account" style="text-decoration:none">Edit my profile</a></p>' : '');
    postsEl.innerHTML = d.posts.length ? d.posts.map(function (p) { return JR.postHtml(p, u, reactions, d.admin); }).join('') : '<p class="empty">No posts yet.</p>';
    if (d.admin && d.email && d.me !== u.username) {
      document.getElementById('admin').hidden = false;
      document.getElementById('aEmail').textContent = d.email;
      function act(kind) {
        var label = kind === 'ban' ? 'BAN' : 'remove';
        if (!confirm('Really ' + label + ' @' + u.username + ' (' + d.email + ')? This deletes their account and posts.')) return;
        var st = document.getElementById('aStatus'); st.className = 'status'; st.textContent = 'Working…';
        fetch('/api/admin/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: kind, email: d.email, reason: document.getElementById('reason').value }) })
          .then(function (r) { return r.json().then(function (x) { if (!r.ok) throw new Error(x.error); return x; }); })
          .then(function (x) { st.textContent = (kind === 'ban' ? 'Banned. ' : 'Removed. ') + x.postsDeleted + ' post(s) deleted.'; setTimeout(function () { location.replace('/admin'); }, 1200); })
          .catch(function (e) { st.className = 'status err'; st.textContent = e.message; });
      }
      document.getElementById('remove').onclick = function () { act('remove'); };
      document.getElementById('ban').onclick = function () { act('ban'); };
    }
  }).catch(function (e) { if (e) document.getElementById('card').innerHTML = '<p class="empty">' + JR.esc(e.message || 'Not found') + '</p>'; });
})();
</script>
<script src="/assets/site-ui.js"></script><script src="/assets/beta-banner.js"></script></body></html>
