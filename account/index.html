<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account · JAVISREVENGE</title><link rel="stylesheet" href="/assets/legal.css"></head><body>
<main class="shell"><a class="brand" href="/">← JAVISREVENGE</a><section class="card"><h1>Your account</h1><p id="identity">Loading…</p><div class="row"><input id="notifications" type="checkbox"><label for="notifications" style="margin:0">Email me website updates. You can turn this off at any time.</label></div><p class="status" id="status"></p><div class="actions"><a class="button secondary" href="/api/auth/logout">Sign out</a><button class="button danger" id="delete" type="button">Delete my account</button></div><p class="muted">Deleting removes your account record and signs you out. Limited records may still be retained where legally required.</p></section></main>
<script src="/assets/site-ui.js"></script><script>(function(){var box=document.getElementById('notifications'),status=document.getElementById('status');fetch('/api/account').then(r=>r.ok?r.json():Promise.reject()).then(a=>{document.getElementById('identity').textContent=a.name+' · '+a.email;box.checked=a.notifications;}).catch(()=>location.replace('/signin?returnTo=/account'));box.addEventListener('change',function(){box.disabled=true;fetch('/api/account/preferences',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notifications:box.checked})}).then(r=>r.ok?r.json():Promise.reject()).then(()=>{status.textContent=box.checked?'Email notifications enabled.':'Email notifications turned off.';}).catch(()=>{box.checked=!box.checked;status.textContent='Could not save that choice.';status.className='status error';}).finally(()=>box.disabled=false);});document.getElementById('delete').addEventListener('click',function(){if(!confirm('Permanently delete your JAVISREVENGE account?'))return;fetch('/api/account',{method:'DELETE'}).then(r=>r.ok?location.replace('/signin?deleted=1'):Promise.reject()).catch(()=>{status.textContent='Could not delete the account.';status.className='status error';});});})();</script>
</body></html>
