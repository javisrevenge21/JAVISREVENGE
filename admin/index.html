<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members · JAVISREVENGE</title><link rel="stylesheet" href="/assets/legal.css"></head><body>
<main class="shell"><a class="brand" href="/">← JAVISREVENGE</a><section class="card"><h1>Email everyone</h1><p>Sends one email to every member who said yes to notifications. Each email includes an unsubscribe link automatically.</p><p id="optins" class="muted">Loading…</p><label>Subject<input id="bSubject" maxlength="160"></label><label>Message<textarea id="bMessage" maxlength="10000" rows="8"></textarea></label><button class="button" id="bSend" type="button">Send to everyone</button><p class="status" id="bStatus"></p></section><section class="card"><h1>Members</h1><p>People who have created an account are listed here. Email can only be sent to people who turned notifications on.</p><p id="summary" class="muted">Loading…</p><div class="user-list" id="users"></div><p class="status" id="status"></p></section></main>
<script src="/assets/site-ui.js"></script><script>(function(){var users=document.getElementById('users'),status=document.getElementById('status');function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}fetch('/api/admin/users').then(async r=>{if(!r.ok)throw new Error((await r.json()).error||'Unable to load');return r.json();}).then(data=>{document.getElementById('summary').textContent=data.users.length+' account'+(data.users.length===1?'':'s');if(!data.users.length){users.innerHTML='<p>No accounts yet.</p>';return;}users.innerHTML=data.users.map((u,i)=>'<article class="user"><strong>'+esc(u.name)+'</strong><span>'+esc(u.email)+'</span><span>'+(u.notifications?'Notifications on':'Notifications off')+' · Last sign-in '+new Date(u.lastSignInAt).toLocaleString()+'</span>'+(u.notifications?'<button class="button secondary send" data-index="'+i+'" style="margin-top:14px">Write email</button><div class="composer" id="composer-'+i+'" hidden><label>Subject<input class="subject" maxlength="160"></label><label>Message<textarea class="message" maxlength="10000"></textarea></label><button class="button submit" data-index="'+i+'">Send email</button></div>':'')+'</article>').join('');data.users.forEach((u,i)=>{var open=users.querySelector('.send[data-index="'+i+'"]');if(open)open.onclick=()=>{document.getElementById('composer-'+i).hidden=false;open.hidden=true;};var submit=users.querySelector('.submit[data-index="'+i+'"]');if(submit)submit.onclick=()=>{var c=document.getElementById('composer-'+i),subject=c.querySelector('.subject').value,message=c.querySelector('.message').value;if(!subject.trim()||!message.trim())return;submit.disabled=true;status.textContent='Sending…';fetch('/api/admin/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:u.email,subject:subject,message:message})}).then(async r=>{var body=await r.json();if(!r.ok)throw new Error(body.error);status.textContent='Email sent to '+u.email+'.';c.hidden=true;}).catch(e=>{status.textContent=e.message;status.className='status error';}).finally(()=>submit.disabled=false);};});}).catch(e=>{document.getElementById('summary').textContent='';status.textContent=e.message;status.className='status error';});})();</script>
<script>(function(){var btn=document.getElementById('bSend'),st=document.getElementById('bStatus'),opt=document.getElementById('optins'),count=0;fetch('/api/admin/users').then(r=>r.ok?r.json():Promise.reject()).then(d=>{count=d.users.filter(u=>u.notifications).length;opt.textContent=count+' member'+(count===1?'':'s')+' will receive it.';}).catch(()=>{opt.textContent='';});btn.onclick=function(){var subject=document.getElementById('bSubject').value.trim(),message=document.getElementById('bMessage').value.trim();st.className='status';if(!subject||!message){st.textContent='Add a subject and a message first.';st.className='status error';return;}if(!confirm('Send "'+subject+'" to '+count+' member'+(count===1?'':'s')+'?'))return;btn.disabled=true;st.textContent='Sending…';fetch('/api/admin/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({all:true,subject:subject,message:message})}).then(async r=>{var b=await r.json();if(!r.ok)throw new Error(b.error);st.textContent='Sent to '+b.sent+' of '+b.total+' member'+(b.total===1?'':'s')+'.'+(b.failures.length?' Some failed: '+b.failures.join('; '):'');document.getElementById('bSubject').value='';document.getElementById('bMessage').value='';}).catch(e=>{st.textContent=e.message;st.className='status error';}).finally(()=>btn.disabled=false);};})();</script></body></html>
