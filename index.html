<title>JAVISREVENGE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; background: #000; }
html { scroll-behavior: smooth; }
body {
color: #fff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
overflow-x: hidden;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.glow {
position: fixed;
left: 50%; top: 50%;
width: min(95vw, 950px);
height: min(95vw, 950px);
margin-left: min(-47.5vw, -475px);
margin-top: min(-47.5vw, -475px);
background: radial-gradient(circle, rgba(255,255,255,0.045) 0%, rgba(0,0,0,0) 66%);
pointer-events: none;
z-index: 1;
will-change: transform;
animation: breathe 9s ease-in-out infinite;
}
@keyframes breathe { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

.view { position: relative; z-index: 2; }
.view.hidden { display: none !important; }
#gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
.wrap { width: 100%; max-width: 560px; text-align: center; }
h1 { font-weight: 600; letter-spacing: 0.08em; }
.gate-title {
font-size: clamp(1.7rem, 6vw, 3rem);
display: inline-flex;
align-items: center;
gap: 0.35em;
white-space: nowrap;
text-shadow: 0 0 30px rgba(255,255,255,0.28), 0 0 90px rgba(255,255,255,0.12);
animation: fadeUp 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.lock { display: inline-block; font-size: 0.82em; animation: lockFloat 4.5s ease-in-out infinite; }
@keyframes lockFloat {
0%, 100% { transform: translateY(0) rotate(0deg); }
25% { transform: translateY(-0.09em) rotate(-5deg); }
75% { transform: translateY(0.05em) rotate(5deg); }
}
@keyframes fadeUp {
from { opacity: 0; transform: translateY(20px); filter: blur(10px); }
to { opacity: 1; transform: none; filter: none; }
}
.gate-form {
margin: 30px auto 0;
display: flex;
gap: 10px;
max-width: 400px;
animation: fadeUp 1.4s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.gate-form.shake { animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
@keyframes shake {
10%, 90% { transform: translateX(-2px); }
20%, 80% { transform: translateX(4px); }
30%, 50%, 70% { transform: translateX(-7px); }
40%, 60% { transform: translateX(7px); }
}
input[type="password"] {
flex: 1; min-width: 0;
padding: 14px 16px;
font-size: 1rem; font-family: inherit; color: #fff;
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.16);
border-radius: 10px; outline: none;
transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
}
input[type="password"]::placeholder { color: rgba(255,255,255,0.35); }
input[type="password"]:focus {
border-color: rgba(255,255,255,0.5);
background: rgba(255,255,255,0.08);
box-shadow: 0 0 0 4px rgba(255,255,255,0.07);
}
.unlock-btn {
padding: 14px 22px;
font-size: 1rem; font-family: inherit; font-weight: 600;
letter-spacing: 0.04em; color: #0a0a0a; background: #fff;
border: 0; border-radius: 10px; cursor: pointer;
transition: transform 0.2s, box-shadow 0.2s;
}
.unlock-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 26px rgba(255,255,255,0.18); }
.unlock-btn:active { transform: translateY(0) scale(0.98); }
.err {
margin-top: 16px; min-height: 1.2em;
font-size: 0.9rem; letter-spacing: 0.03em; color: #ff8b8b;
opacity: 0; transition: opacity 0.25s;
}
.err.show { opacity: 1; }

/* ---------- COVER ---------- */
.cover {
position: relative;
min-height: 100svh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 24px 12px 0;
}
.stage {
position: relative;
width: min(96vw, 1500px);
aspect-ratio: 1916 / 821;
}
.sword-layer { position: absolute; will-change: transform; }
.sword-layer img { display: block; width: 100%; height: auto; }
.lay-top { left: 3.236%; top: 1.827%; width: 91.336%; }
.lay-bot { left: 5.793%; top: 47.016%; width: 91.336%; }
.idle-a { animation: idleA 11s ease-in-out infinite; }
.idle-b { animation: idleB 13s ease-in-out infinite; }
@keyframes idleA {
0%, 100% { transform: translateY(0) rotate(0deg); }
50% { transform: translateY(-0.9%) rotate(-0.3deg); }
}
@keyframes idleB {
0%, 100% { transform: translateY(0) rotate(0deg); }
50% { transform: translateY(0.9%) rotate(0.3deg); }
}
.wordmark {
position: absolute;
left: 50%; top: 50%;
transform: translate(-50%, -50%);
white-space: nowrap;
font-family: Georgia, "Times New Roman", Times, serif;
font-weight: 700;
font-size: clamp(1.35rem, 5.9vw, 5.4rem);
letter-spacing: 0.12em;
background: linear-gradient(180deg, #9aa0a8 0%, #666c74 18%, #3a3f46 40%, #0e1013 56%, #2e333a 74%, #7c828b 100%);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
filter: drop-shadow(0 2px 3px rgba(0,0,0,0.95)) drop-shadow(0 0 16px rgba(140,155,175,0.10));
animation: markIn 1.8s 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
@keyframes markIn {
from { opacity: 0; letter-spacing: 0.5em; filter: blur(14px); }
to { opacity: 1; letter-spacing: 0.12em; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.95)); }
}
.cue {
position: absolute;
left: 50%; bottom: 26px;
transform: translateX(-50%);
display: flex; flex-direction: column; align-items: center; gap: 9px;
font-size: 0.62rem; letter-spacing: 0.4em;
color: rgba(255,255,255,0.4);
animation: fadeUp 1.2s 1.4s both;
}
.cue i { display: block; width: 1px; height: 34px; background: linear-gradient(180deg, rgba(255,255,255,0.5), transparent); animation: cueDrop 2s ease-in-out infinite; }
@keyframes cueDrop { 0%,100% { transform: scaleY(0.5); opacity: 0.35; } 50% { transform: scaleY(1); opacity: 1; } }

/* ---------- BELOW THE FOLD ---------- */
.deck { padding: 4vh 24px 16vh; display: flex; justify-content: center; }
.sub-wrap { overflow: hidden; }
.sub {
font-size: clamp(1.05rem, 3.4vw, 1.6rem);
font-weight: 600; line-height: 1.45; letter-spacing: 0.04em;
color: #ffffff;
text-shadow: 0 0 26px rgba(255,255,255,0.32), 0 0 70px rgba(255,255,255,0.14);
will-change: transform, opacity;
animation: sweep 13s cubic-bezier(0.45, 0, 0.25, 1) 0.6s infinite;
}
@keyframes sweep {
0% { transform: translateX(115%); opacity: 0; }
10% { transform: translateX(0); opacity: 1; }
38% { transform: translateX(0); opacity: 1; }
50% { transform: translateX(-115%); opacity: 0; }
58% { transform: translateX(-115%); opacity: 0; }
70% { transform: translateX(0); opacity: 1; }
88% { transform: translateX(0); opacity: 1; }
100% { transform: translateX(115%); opacity: 0; }
}
.tiles { margin-top: 34px; }
.reveal { opacity: 0; transform: translateY(26px); filter: blur(8px); transition: opacity 0.8s cubic-bezier(0.2,0.7,0.2,1), transform 0.8s cubic-bezier(0.2,0.7,0.2,1), filter 0.8s; }
.reveal.in { opacity: 1; transform: none; filter: none; }
.reveal.d1 { transition-delay: 0.08s; }
.reveal.d2 { transition-delay: 0.16s; }
.reveal.d3 { transition-delay: 0.24s; }
.reveal.d4 { transition-delay: 0.32s; }

.tile {
position: relative;
display: flex; align-items: center; justify-content: center;
width: 100%; margin: 16px 0 0; padding: 18px;
font-size: 1.05rem; font-family: inherit; font-weight: 700;
letter-spacing: 0.3em; text-align: center;
color: rgba(255,255,255,0.9); text-decoration: none;
background: #000000;
border: 1px solid rgba(255,255,255,0.14);
border-radius: 14px; cursor: pointer;
overflow: hidden; isolation: isolate;
transform-style: preserve-3d; will-change: transform;
transition: border-color 0.3s, box-shadow 0.35s, color 0.3s, background 0.3s, transform 0.18s ease-out;
}
.tile span { position: relative; z-index: 2; transition: letter-spacing 0.35s, text-shadow 0.35s; }
.tile::before {
content: ''; position: absolute; inset: 0; z-index: 1;
background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.13), transparent 62%);
opacity: 0; transition: opacity 0.3s;
}
.tile::after {
content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; z-index: 1;
background: linear-gradient(100deg, transparent, rgba(255,255,255,0.10), transparent);
transform: skewX(-18deg); opacity: 0;
}
.tile:hover::before, .tile:focus-visible::before { opacity: 1; }
.tile:hover::after, .tile:focus-visible::after { animation: sheen 0.85s ease-out; }
@keyframes sheen {
0% { left: -60%; opacity: 0; }
15% { opacity: 1; }
100% { left: 130%; opacity: 0; }
}
.tile:hover, .tile:focus-visible {
color: #fff; background: #000000;
border-color: rgba(255,255,255,0.45);
box-shadow: 0 14px 40px rgba(255,255,255,0.13);
outline: none;
}
.tile:hover span { letter-spacing: 0.36em; text-shadow: 0 0 22px rgba(255,255,255,0.45); }
.tile:active { transform: scale(0.985) !important; }

.chev {
position: absolute; right: 18px; width: 16px; height: 16px; z-index: 2;
fill: none; stroke: rgba(255,255,255,0.6); stroke-width: 2.2;
stroke-linecap: round; stroke-linejoin: round;
transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1), stroke 0.3s;
}
.tile[aria-expanded="true"] .chev { transform: rotate(180deg); stroke: #fff; }

.panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.45s cubic-bezier(0.2, 0.7, 0.2, 1); }
.panel.open { grid-template-rows: 1fr; }
.panel-inner { overflow: hidden; }
.subtile {
position: relative; display: block; margin: 10px 0 0 0; padding: 15px 18px;
font-size: 0.92rem; font-weight: 600; letter-spacing: 0.26em;
color: rgba(255,255,255,0.75); text-decoration: none;
background: #000000;
border: 1px solid rgba(255,255,255,0.10);
border-left: 2px solid rgba(255,255,255,0.28);
border-radius: 12px; overflow: hidden;
opacity: 0; transform: translateY(-8px);
transition: color 0.3s, background 0.3s, border-color 0.3s, transform 0.3s, opacity 0.35s, padding-left 0.3s;
}
.panel.open .subtile { opacity: 1; transform: none; transition-delay: calc(0.12s + var(--j, 0) * 0.07s); }
.subtile:hover {
color: #fff; background: #000000;
border-color: rgba(255,255,255,0.4); border-left-color: #fff; padding-left: 26px;
}
.hint {
margin-top: 12px; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase;
color: rgba(255,255,255,0.26); opacity: 0; transform: translateY(-6px);
transition: opacity 0.35s, transform 0.35s;
}
.panel.open .hint { opacity: 1; transform: none; transition-delay: 0.3s; }

@media (prefers-reduced-motion: reduce) {
.glow, .lock, .gate-title, .gate-form, .sub, .wordmark, .cue, .cue i, .idle-a, .idle-b { animation: none !important; }
.tile, .subtile, .chev, .panel, .reveal { transition: none !important; }
.reveal { opacity: 1; transform: none; filter: none; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="glow" id="glow"></div>

<main id="gate" class="view">

</div>

var pw = document.getElementById('pw');
var err = document.getElementById('err');

function unlock(skipStore) {
if (!skipStore) {
try { sessionStorage.setItem('jr_unlocked', '1'); } catch (e) {}
}
gate.classList.add('hidden');
welcome.classList.remove('hidden');

unlock(false);
} else {

void form.offsetWidth;
form.classList.add('shake');
pw.value = '';
pw.focus();

});

<script>
(function () {
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var fine = window.matchMedia('(pointer: fine)').matches;

['imgTop', 'imgBot'].forEach(function (id) {
var el = document.getElementById(id);
if (el) { el.addEventListener('error', function () { el.style.display = 'none'; }); }
});

var toggle = document.getElementById('opsToggle');
var panel = document.getElementById('opsPanel');
if (toggle && panel) {
toggle.addEventListener('click', function () {
var open = panel.classList.toggle('open');
toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
});
}

var reveals = document.querySelectorAll('.reveal');
if ('IntersectionObserver' in window && !reduced) {
var io = new IntersectionObserver(function (entries) {
entries.forEach(function (en) {
if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
});
}, { threshold: 0.18, rootMargin: '0px 0px -8% 0px' });
Array.prototype.forEach.call(reveals, function (el) { io.observe(el); });
} else {
Array.prototype.forEach.call(reveals, function (el) { el.classList.add('in'); });
}

var layTop = document.getElementById('layTop');
var layBot = document.getElementById('layBot');
var mark = document.getElementById('wordmark');
var cue = document.getElementById('cue');
var ticking = false;

function onScroll() {
if (ticking) { return; }
ticking = true;
requestAnimationFrame(function () {
ticking = false;
var h = window.innerHeight || 1;
var p = Math.min(Math.max(window.pageYOffset / (h * 0.85), 0), 1);
var e = p * p * (3 - 2 * p);
if (layTop) {
layTop.style.transform = 'translate3d(' + (-7 * e) + 'vw,' + (-19 * e) + 'vh,0) rotate(' + (-5 * e) + 'deg) scale(' + (1 + 0.5 * e) + ')';
}
if (layBot) {
layBot.style.transform = 'translate3d(' + (7 * e) + 'vw,' + (19 * e) + 'vh,0) rotate(' + (5 * e) + 'deg) scale(' + (1 + 0.5 * e) + ')';
}
if (mark) {
mark.style.transform = 'translate(-50%,-50%) scale(' + (1 - 0.14 * e) + ')';
mark.style.opacity = String(Math.max(1 - e * 1.25, 0));
}
if (cue) { cue.style.opacity = String(Math.max(1 - e * 2.4, 0)); }
});
}

if (!reduced) {
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('jr:unlocked', onScroll);
onScroll();
}

if (reduced || !fine) { return; }

var tiles = document.querySelectorAll('.tile');
Array.prototype.forEach.call(tiles, function (tile) {
tile.addEventListener('mousemove', function (ev) {
var r = tile.getBoundingClientRect();
var px = (ev.clientX - r.left) / r.width;
var py = (ev.clientY - r.top) / r.height;
tile.style.setProperty('--mx', (px * 100) + '%');
tile.style.setProperty('--my', (py * 100) + '%');
tile.style.transform = 'perspective(700px) rotateX(' + ((0.5 - py) * 6) + 'deg) rotateY(' + ((px - 0.5) * 8) + 'deg) translateY(-2px)';
});
tile.addEventListener('mouseleave', function () { tile.style.transform = ''; });
});

var glow = document.getElementById('glow');
var gx = 0, gy = 0, tx = 0, ty = 0, raf = null;
function loop() {
gx += (tx - gx) * 0.06;
gy += (ty - gy) * 0.06;
glow.style.transform = 'translate3d(' + gx.toFixed(2) + 'px,' + gy.toFixed(2) + 'px,0)';
raf = requestAnimationFrame(loop);
}
window.addEventListener('mousemove', function (ev) {
tx = (ev.clientX / window.innerWidth - 0.5) * 70;
ty = (ev.clientY / window.innerHeight - 0.5) * 70;
if (!raf) { raf = requestAnimationFrame(loop); }
});
})();
</script>

<script>
(function () {
var c = document.getElementById('bg');
var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var FALLBACK = 'radial-gradient(ellipse at 50% 40%, #0d0d0f 0%, #050505 45%, #000000 100%)';

if (!gl) { document.body.style.background = FALLBACK; return; }

var vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';

var fs = [
'precision highp float;',
'uniform vec2 u_res;',
'uniform float u_time;',
'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }',
'float noise(vec2 p) {',
'  vec2 i = floor(p), f = fract(p);',
'  vec2 u = f * f * (3.0 - 2.0 * f);',
'  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),',
'             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
'}',
'float fbm(vec2 p) {',
'  float v = 0.0, a = 0.5;',
'  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);',
'  for (int i = 0; i < 6; i++) { v += a * noise(p); p = m * p; a *= 0.5; }',
'  return v;',
'}',
'void main() {',
'  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);',
'  float t = u_time * 0.06;',
'  vec2 p = uv * 1.6;',
'  vec2 q = vec2(fbm(p + vec2(0.0, t)), fbm(p + vec2(5.2, 1.3) - t * 0.5));',
'  vec2 r = vec2(fbm(p + 3.0 * q + vec2(1.7, 9.2) + t * 0.7),',
'                fbm(p + 3.0 * q + vec2(8.3, 2.8) - t * 0.6));',
'  float f = fbm(p + 3.0 * r);',
'  vec3 col = vec3(0.0);',
'  col = mix(col, vec3(0.06, 0.06, 0.07), clamp(f * f * 2.4, 0.0, 1.0));',
'  col = mix(col, vec3(0.36, 0.36, 0.39), clamp(length(q) * 0.75, 0.0, 1.0) * 0.48);',
'  col = mix(col, vec3(0.10, 0.11, 0.12), clamp(r.x * 0.85, 0.0, 1.0) * 0.26);',
'  col += vec3(0.90, 0.92, 1.00) * pow(clamp(f, 0.0, 1.0), 7.5) * 0.46;',
'  float d = length(uv * vec2(1.0, 1.15));',
'  col *= smoothstep(1.12, 0.04, d);',
'  col = col * col * 2.6;',
'  col *= 0.90 + 0.10 * sin(u_time * 0.25);',
'  col += (hash(gl_FragCoord.xy + fract(u_time)) - 0.5) * 0.02;',
'  gl_FragColor = vec4(max(col, 0.0), 1.0);',
'}'
].join('\n');

function compile(type, src) {
var s = gl.createShader(type);
gl.shaderSource(s, src);
gl.compileShader(s);
return s;
}

var prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
document.body.style.background = FALLBACK;
return;
}
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

var uRes = gl.getUniformLocation(prog, 'u_res');
var uTime = gl.getUniformLocation(prog, 'u_time');

function resize() {
var dpr = Math.min(window.devicePixelRatio || 1, 2);
c.width = Math.floor(window.innerWidth * dpr);
c.height = Math.floor(window.innerHeight * dpr);
gl.viewport(0, 0, c.width, c.height);
}
window.addEventListener('resize', resize);
resize();

function draw(t) {
gl.uniform2f(uRes, c.width, c.height);
gl.uniform1f(uTime, t);
gl.drawArrays(gl.TRIANGLES, 0, 3);
}

if (reduced) { draw(14.0); return; }

var t0 = performance.now();
var elapsed = 0;
var raf = null;

function frame(now) {
elapsed = (now - t0) / 1000;
draw(elapsed);
raf = requestAnimationFrame(frame);
}
raf = requestAnimationFrame(frame);

document.addEventListener('visibilitychange', function () {
if (document.hidden) {
if (raf) { cancelAnimationFrame(raf); raf = null; }
} else if (!raf) {
t0 = performance.now() - elapsed * 1000;
raf = requestAnimationFrame(frame);
}
});
})();
</script>
