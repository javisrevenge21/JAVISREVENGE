<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>JAVISREVENGE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; background: #000; }
body {
color: #fff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
overflow-x: hidden;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.glow {
position: fixed;
left: 50%; top: 50%;
transform: translate(-50%, -50%);
width: min(95vw, 950px);
height: min(95vw, 950px);
background: radial-gradient(circle, rgba(255,255,255,0.045) 0%, rgba(0,0,0,0) 66%);
pointer-events: none;
z-index: 1;
animation: breathe 9s ease-in-out infinite;
}
@keyframes breathe {
0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
50% { opacity: 1; transform: translate(-50%, -50%) scale(1.09); }
}
.view {
position: relative;
z-index: 2;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 48px 24px;
}
.view.hidden { display: none; }
.wrap { width: 100%; max-width: 560px; text-align: center; }
h1 {
font-weight: 600;
letter-spacing: 0.08em;
text-shadow: 0 0 30px rgba(255,255,255,0.28), 0 0 90px rgba(255,255,255,0.12);
}
.gate-title {
font-size: clamp(1.7rem, 6vw, 3rem);
display: inline-flex;
align-items: center;
gap: 0.35em;
white-space: nowrap;
animation: fadeUp 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.lock { display: inline-block; font-size: 0.82em; animation: lockFloat 4.5s ease-in-out infinite; }
@keyframes lockFloat {
0%, 100% { transform: translateY(0) rotate(0deg); }
25% { transform: translateY(-0.09em) rotate(-5deg); }
75% { transform: translateY(0.05em) rotate(5deg); }
}
@keyframes fadeUp {
from { opacity: 0; transform: translateY(20px); filter: blur(10px); }
to { opacity: 1; transform: none; filter: none; }
}
.gate-form {
margin: 30px auto 0;
display: flex;
gap: 10px;
max-width: 400px;
animation: fadeUp 1.4s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.gate-form.shake { animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
@keyframes shake {
10%, 90% { transform: translateX(-2px); }
20%, 80% { transform: translateX(4px); }
30%, 50%, 70% { transform: translateX(-7px); }
40%, 60% { transform: translateX(7px); }
}
input[type="password"] {
flex: 1;
min-width: 0;
padding: 14px 16px;
font-size: 1rem;
font-family: inherit;
color: #fff;
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.16);
border-radius: 10px;
outline: none;
transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
}
input[type="password"]::placeholder { color: rgba(255,255,255,0.35); }
input[type="password"]:focus {
border-color: rgba(255,255,255,0.5);
background: rgba(255,255,255,0.08);
box-shadow: 0 0 0 4px rgba(255,255,255,0.07);
}
button {
padding: 14px 22px;
font-size: 1rem;
font-family: inherit;
font-weight: 600;
letter-spacing: 0.04em;
color: #0a0a0a;
background: #fff;
border: 0;
border-radius: 10px;
cursor: pointer;
transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
}
button:hover { transform: translateY(-1px); box-shadow: 0 8px 26px rgba(255,255,255,0.18); }
button:active { transform: translateY(0); }
.err {
margin-top: 16px;
min-height: 1.2em;
font-size: 0.9rem;
letter-spacing: 0.03em;
color: #ff8b8b;
opacity: 0;
transition: opacity 0.25s;
}
.err.show { opacity: 1; }
.brand {
font-size: clamp(1.8rem, 8vw, 4rem);
letter-spacing: 0.16em;
animation: fadeUp 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.rule {
width: min(320px, 70vw);
height: 1px;
margin: 22px auto 0;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
animation: fadeUp 1.2s 0.15s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.sub {
margin-top: 18px;
font-size: 1rem;
letter-spacing: 0.06em;
color: rgba(255,255,255,0.62);
animation: fadeUp 1.2s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.tile {
display: block;
margin: 16px auto 0;
padding: 18px;
font-size: 1.05rem;
font-weight: 700;
letter-spacing: 0.3em;
text-align: center;
color: rgba(255,255,255,0.9);
text-decoration: none;
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.14);
border-radius: 14px;
transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s, color 0.25s, background 0.25s;
}
.tile:first-of-type { margin-top: 36px; }
.tile:hover {
color: #fff;
background: rgba(255,255,255,0.07);
border-color: rgba(255,255,255,0.45);
box-shadow: 0 10px 34px rgba(255,255,255,0.12);
transform: translateY(-2px);
}
.tile-blog { animation: fadeUp 1.2s 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.tile-kirk { animation: fadeUp 1.2s 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
@media (prefers-reduced-motion: reduce) {
.glow, .lock, .gate-title, .gate-form, .brand, .rule, .sub, .tile { animation: none !important; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="glow"></div>

<main id="gate" class="view">
<div class="wrap">
<h1 class="gate-title">Password <span class="lock" role="img" aria-label="locked">&#128274;</span></h1>
<form id="gateForm" class="gate-form" autocomplete="off">
<input id="pw" type="password" placeholder="Enter password" autocomplete="off" spellcheck="false" aria-label="Password" />
<button type="submit">Unlock</button>
</form>
<p class="err" id="err" role="alert"></p>
</div>
</main>

<main id="welcome" class="view hidden">
<div class="wrap">
<h1 class="brand">JAVISREVENGE</h1>
<div class="rule"></div>
<p class="sub">Welcome.</p>
<a class="tile tile-blog" href="/blog">BLOG</a>
<a class="tile tile-kirk" href="/kirk">KIRK</a>
</div>
</main>

<script>
(function () {
var KEY = 'cmV2ZW5nZWlzY29taW5n';
var gate = document.getElementById('gate');
var welcome = document.getElementById('welcome');
var form = document.getElementById('gateForm');
var pw = document.getElementById('pw');
var err = document.getElementById('err');

function unlock(skipStore) {
if (!skipStore) {
try { sessionStorage.setItem('jr_unlocked', '1'); } catch (e) {}
}
gate.classList.add('hidden');
welcome.classList.remove('hidden');
}

form.addEventListener('submit', function (e) {
e.preventDefault();
var expected = '';
try { expected = atob(KEY); } catch (e2) { expected = ''; }
if (pw.value === expected) {
err.classList.remove('show');
unlock(false);
} else {
err.textContent = 'Incorrect password.';
err.classList.add('show');
form.classList.remove('shake');
void form.offsetWidth;
form.classList.add('shake');
pw.value = '';
pw.focus();
}
});

try {
if (sessionStorage.getItem('jr_unlocked') === '1') { unlock(true); }
else { pw.focus(); }
} catch (e3) { pw.focus(); }
})();
</script>

<script>
(function () {
var c = document.getElementById('bg');
var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var FALLBACK = 'radial-gradient(ellipse at 50% 40%, #0d0d0f 0%, #050505 45%, #000000 100%)';

if (!gl) { document.body.style.background = FALLBACK; return; }

var vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';

var fs = [
'precision highp float;',
'uniform vec2 u_res;',
'uniform float u_time;',
'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }',
'float noise(vec2 p) {',
'  vec2 i = floor(p), f = fract(p);',
'  vec2 u = f * f * (3.0 - 2.0 * f);',
'  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),',
'             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
'}',
'float fbm(vec2 p) {',
'  float v = 0.0, a = 0.5;',
'  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);',
'  for (int i = 0; i < 6; i++) { v += a * noise(p); p = m * p; a *= 0.5; }',
'  return v;',
'}',
'void main() {',
'  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);',
'  float t = u_time * 0.06;',
'  vec2 p = uv * 1.6;',
'  vec2 q = vec2(fbm(p + vec2(0.0, t)), fbm(p + vec2(5.2, 1.3) - t * 0.5));',
'  vec2 r = vec2(fbm(p + 3.0 * q + vec2(1.7, 9.2) + t * 0.7),',
'                fbm(p + 3.0 * q + vec2(8.3, 2.8) - t * 0.6));',
'  float f = fbm(p + 3.0 * r);',
'  vec3 col = vec3(0.0);',
'  col = mix(col, vec3(0.06, 0.06, 0.07), clamp(f * f * 2.4, 0.0, 1.0));',
'  col = mix(col, vec3(0.36, 0.36, 0.39), clamp(length(q) * 0.75, 0.0, 1.0) * 0.48);',
'  col = mix(col, vec3(0.10, 0.11, 0.12), clamp(r.x * 0.85, 0.0, 1.0) * 0.26);',
'  col += vec3(0.90, 0.92, 1.00) * pow(clamp(f, 0.0, 1.0), 7.5) * 0.46;',
'  float d = length(uv * vec2(1.0, 1.15));',
'  col *= smoothstep(1.12, 0.04, d);',
'  col = col * col * 2.6;',
'  col *= 0.90 + 0.10 * sin(u_time * 0.25);',
'  col += (hash(gl_FragCoord.xy + fract(u_time)) - 0.5) * 0.02;',
'  gl_FragColor = vec4(max(col, 0.0), 1.0);',
'}'
].join('\n');

function compile(type, src) {
var s = gl.createShader(type);
gl.shaderSource(s, src);
gl.compileShader(s);
return s;
}

var prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
document.body.style.background = FALLBACK;
return;
}
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

var uRes = gl.getUniformLocation(prog, 'u_res');
var uTime = gl.getUniformLocation(prog, 'u_time');

function resize() {
var dpr = Math.min(window.devicePixelRatio || 1, 2);
c.width = Math.floor(window.innerWidth * dpr);
c.height = Math.floor(window.innerHeight * dpr);
gl.viewport(0, 0, c.width, c.height);
}
window.addEventListener('resize', resize);
resize();

function draw(t) {
gl.uniform2f(uRes, c.width, c.height);
gl.uniform1f(uTime, t);
gl.drawArrays(gl.TRIANGLES, 0, 3);
}

if (reduced) { draw(14.0); return; }

var t0 = performance.now();
var elapsed = 0;
var raf = null;

function frame(now) {
elapsed = (now - t0) / 1000;
draw(elapsed);
raf = requestAnimationFrame(frame);
}
raf = requestAnimationFrame(frame);

document.addEventListener('visibilitychange', function () {
if (document.hidden) {
if (raf) { cancelAnimationFrame(raf); raf = null; }
} else if (!raf) {
t0 = performance.now() - elapsed * 1000;
raf = requestAnimationFrame(frame);
}
});
})();
</script>
</body>
</html>
