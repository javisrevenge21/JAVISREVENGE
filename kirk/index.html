<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>Kirk</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; background: #000; }
body {
color: #fff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
overflow-x: hidden;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.glow {
position: fixed;
left: 50%; top: 50%;
transform: translate(-50%, -50%);
width: min(95vw, 950px);
height: min(95vw, 950px);
background: radial-gradient(circle, rgba(255,255,255,0.045) 0%, rgba(0,0,0,0) 66%);
pointer-events: none;
z-index: 1;
animation: breathe 9s ease-in-out infinite;
}
@keyframes breathe {
0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
50% { opacity: 1; transform: translate(-50%, -50%) scale(1.09); }
}
.view {
position: relative;
z-index: 2;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px 24px;
}
h1 {
font-weight: 700;
letter-spacing: 0.05em;
font-size: clamp(1.8rem, 6vw, 2.6rem);
margin-bottom: 24px;
text-align: center;
text-shadow: 0 0 30px rgba(255,255,255,0.28), 0 0 90px rgba(255,255,255,0.12);
animation: fadeUp 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
@keyframes fadeUp {
from { opacity: 0; transform: translateY(20px); filter: blur(10px); }
to { opacity: 1; transform: none; filter: none; }
}
.wrap {
width: 100%;
max-width: 640px;
animation: fadeUp 1.4s 0.2s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
video {
width: 100%;
height: auto;
border-radius: 12px;
border: 1px solid rgba(255,255,255,0.12);
box-shadow: 0 0 60px rgba(255,255,255,0.08);
background: #000;
display: block;
}
.back {
display: inline-block;
margin-top: 22px;
padding: 12px 20px;
font-size: 0.9rem;
letter-spacing: 0.16em;
color: rgba(255,255,255,0.75);
text-decoration: none;
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.14);
border-radius: 10px;
transition: color 0.25s, border-color 0.25s, background 0.25s;
animation: fadeUp 1.4s 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.back:hover {
color: #fff;
background: rgba(255,255,255,0.07);
border-color: rgba(255,255,255,0.4);
}
@media (prefers-reduced-motion: reduce) {
.glow, h1, .wrap, .back { animation: none !important; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="glow"></div>

<main class="view">
<h1>Revenge is here</h1>
<div class="wrap">
<video controls autoplay muted loop playsinline preload="metadata">
<source src="/kirk/kirk.mp4" type="video/mp4" />
<source src="/kirk/kirk.mov" type="video/quicktime" />
Your browser does not support the video tag.
</video>
</div>
<a class="back" href="/">&lsaquo; BACK</a>
</main>

<script>
(function () {
var c = document.getElementById('bg');
var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var FALLBACK = 'radial-gradient(ellipse at 50% 40%, #0d0d0f 0%, #050505 45%, #000000 100%)';

if (!gl) { document.body.style.background = FALLBACK; return; }

var vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';

var fs = [
'precision highp float;',
'uniform vec2 u_res;',
'uniform float u_time;',
'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }',
'float noise(vec2 p) {',
'  vec2 i = floor(p), f = fract(p);',
'  vec2 u = f * f * (3.0 - 2.0 * f);',
'  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),',
'             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
'}',
'float fbm(vec2 p) {',
'  float v = 0.0, a = 0.5;',
'  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);',
'  for (int i = 0; i < 6; i++) { v += a * noise(p); p = m * p; a *= 0.5; }',
'  return v;',
'}',
'void main() {',
'  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);',
'  float t = u_time * 0.06;',
'  vec2 p = uv * 1.6;',
'  vec2 q = vec2(fbm(p + vec2(0.0, t)), fbm(p + vec2(5.2, 1.3) - t * 0.5));',
'  vec2 r = vec2(fbm(p + 3.0 * q + vec2(1.7, 9.2) + t * 0.7),',
'                fbm(p + 3.0 * q + vec2(8.3, 2.8) - t * 0.6));',
'  float f = fbm(p + 3.0 * r);',
'  vec3 col = vec3(0.0);',
'  col = mix(col, vec3(0.06, 0.06, 0.07), clamp(f * f * 2.4, 0.0, 1.0));',
'  col = mix(col, vec3(0.36, 0.36, 0.39), clamp(length(q) * 0.75, 0.0, 1.0) * 0.48);',
'  col = mix(col, vec3(0.10, 0.11, 0.12), clamp(r.x * 0.85, 0.0, 1.0) * 0.26);',
'  col += vec3(0.90, 0.92, 1.00) * pow(clamp(f, 0.0, 1.0), 7.5) * 0.46;',
'  float d = length(uv * vec2(1.0, 1.15));',
'  col *= smoothstep(1.12, 0.04, d);',
'  col = col * col * 2.6;',
'  col *= 0.90 + 0.10 * sin(u_time * 0.25);',
'  col += (hash(gl_FragCoord.xy + fract(u_time)) - 0.5) * 0.02;',
'  gl_FragColor = vec4(max(col, 0.0), 1.0);',
'}'
].join('\n');

function compile(type, src) {
var s = gl.createShader(type);
gl.shaderSource(s, src);
gl.compileShader(s);
return s;
}

var prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
document.body.style.background = FALLBACK;
return;
}
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

var uRes = gl.getUniformLocation(prog, 'u_res');
var uTime = gl.getUniformLocation(prog, 'u_time');

function resize() {
var dpr = Math.min(window.devicePixelRatio || 1, 2);
c.width = Math.floor(window.innerWidth * dpr);
c.height = Math.floor(window.innerHeight * dpr);
gl.viewport(0, 0, c.width, c.height);
}
window.addEventListener('resize', resize);
resize();

function draw(t) {
gl.uniform2f(uRes, c.width, c.height);
gl.uniform1f(uTime, t);
gl.drawArrays(gl.TRIANGLES, 0, 3);
}

if (reduced) { draw(14.0); return; }

var t0 = performance.now();
var elapsed = 0;
var raf = null;

function frame(now) {
elapsed = (now - t0) / 1000;
draw(elapsed);
raf = requestAnimationFrame(frame);
}
raf = requestAnimationFrame(frame);

document.addEventListener('visibilitychange', function () {
if (document.hidden) {
if (raf) { cancelAnimationFrame(raf); raf = null; }
} else if (!raf) {
t0 = performance.now() - elapsed * 1000;
raf = requestAnimationFrame(frame);
}
});
})();
</script>
</body>
</html>
